let _id = 1;
const uid = () => String(_id++);

function QuizApp() {
  const [phase, setPhase] = useState("setup"); // setup | selectCats | playing | results | prize
  const [cardsEnabled, setCardsEnabled] = useState(true);
  const [cardMap, setCardMap] = useState({}); // qId -> CARDS[i]
  const [teams, setTeams] = useState([
    { id: uid(), name: "Equipo 1", color: TEAM_COLORS[0] },
    { id: uid(), name: "Equipo 2", color: TEAM_COLORS[1] },
  ]);
  const [categories, setCategories] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [selectedCatIds, setSelectedCatIds] = useState([]);
  const [awards, setAwards] = useState({}); // questionId -> teamId | "none"

  // timer
  const [timerEnabled, setTimerEnabled] = useState(true);
  const [timerDuration, setTimerDuration] = useState(60);
  const [timeLeft, setTimeLeft] = useState(60);
  const [timerRunning, setTimerRunning] = useState(false);

  const [muted, setMuted] = useState(false);
  const audioCtx = useRef(null);

  /* ---------- audio ---------- */
  const sound = (kind) => {
    if (muted) return;
    try {
      if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx.current;
      const now = ctx.currentTime;
      const play = (freq, start, dur, type = "sine", vol = 0.18) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type; o.frequency.value = freq;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0, now + start);
        g.gain.linearRampToValueAtTime(vol, now + start + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        o.start(now + start); o.stop(now + start + dur);
      };
      if (kind === "correct") { play(660, 0, 0.12, "triangle"); play(990, 0.1, 0.22, "triangle"); }
      else if (kind === "timeup") { play(160, 0, 0.45, "sawtooth", 0.22); play(120, 0.05, 0.5, "sawtooth", 0.18); }
      else if (kind === "tick") { play(880, 0, 0.05, "square", 0.07); }
      else if (kind === "start") { play(523, 0, 0.1, "triangle"); play(784, 0.09, 0.18, "triangle"); }
    } catch (e) { /* ignore */ }
  };

  /* ---------- timer engine ---------- */
  useEffect(() => {
    if (!timerRunning) return;
    if (timeLeft <= 0) { setTimerRunning(false); sound("timeup"); return; }
    const t = setTimeout(() => {
      setTimeLeft((v) => {
        if (v <= 4 && v > 1) sound("tick");
        return v - 1;
      });
    }, 1000);
    return () => clearTimeout(t);
  }, [timerRunning, timeLeft]); // eslint-disable-line

  const resetTimer = () => { setTimeLeft(timerDuration); setTimerRunning(false); };

  /* ---------- derived: categories that have questions + the active game set ---------- */
  const eligibleCats = useMemo(
    () => categories.filter((c) => questions.some((q) => q.categoryId === c.id)),
    [categories, questions]
  );
  // pickedQIds: the randomly-selected question per category+points combo,
  // fixed at startGame so the same questions stay for the whole game.
  const [pickedQIds, setPickedQIds] = useState(null);

  const gameQuestions = useMemo(() => {
    if (pickedQIds) {
      // restore the fixed selection in category order
      const order = {};
      selectedCatIds.forEach((id, i) => (order[id] = i));
      return pickedQIds
        .map((id) => questions.find((q) => q.id === id))
        .filter(Boolean)
        .sort((a, b) => order[a.categoryId] - order[b.categoryId]);
    }
    // fallback before game starts (setup/selectCats phase)
    const order = {};
    selectedCatIds.forEach((id, i) => (order[id] = i));
    return questions
      .filter((q) => selectedCatIds.includes(q.categoryId))
      .sort((a, b) => order[a.categoryId] - order[b.categoryId]);
  }, [questions, selectedCatIds, pickedQIds]);

  /* ---------- derived scores ---------- */
  const scores = useMemo(() => {
    const s = {};
    teams.forEach((t) => (s[t.id] = 0));
    // question deltas
    gameQuestions.forEach((q) => {
      const entry = awards[q.id];
      if (entry?.resolved && entry.deltas) {
        teams.forEach((t) => { s[t.id] = (s[t.id] || 0) + (entry.deltas[t.id] || 0); });
      }
    });
    // card-effect deltas (keys like "card_donate_<qid>" / "card_swap_<qid>")
    Object.values(awards).forEach((entry) => {
      if (entry?.isCardEffect && entry.deltas) {
        teams.forEach((t) => { s[t.id] = (s[t.id] || 0) + (entry.deltas[t.id] || 0); });
      }
    });
    return s;
  }, [teams, gameQuestions, awards]);

  const ranking = useMemo(
    () => [...teams].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0)),
    [teams, scores]
  );

  const catById = useMemo(() => Object.fromEntries(categories.map((c) => [c.id, c])), [categories]);

  /* ---------- team helpers ---------- */
  const addTeam = () => {
    if (teams.length >= 8) return;
    setTeams((t) => [...t, { id: uid(), name: `Equipo ${t.length + 1}`, color: TEAM_COLORS[t.length % TEAM_COLORS.length] }]);
  };
  const removeTeam = (id) => setTeams((t) => t.filter((x) => x.id !== id));
  const renameTeam = (id, name) => setTeams((t) => t.map((x) => (x.id === id ? { ...x, name } : x)));

  /* ---------- category helpers ---------- */
  const [catForm, setCatForm] = useState("");
  const addCategory = () => {
    const name = catForm.trim();
    if (!name) return;
    if (categories.some((c) => c.name.toLowerCase() === name.toLowerCase())) { setCatForm(""); return; }
    setCategories((c) => [...c, { id: uid(), name, color: CATEGORY_COLORS[c.length % CATEGORY_COLORS.length] }]);
    setCatForm("");
  };
  const removeCategory = (id) => {
    setCategories((c) => c.filter((x) => x.id !== id));
    setQuestions((qs) => qs.map((q) => (q.categoryId === id ? { ...q, categoryId: "" } : q)));
  };

  /* ---------- question helpers ---------- */
  const [qForm, setQForm] = useState({ text: "", categoryId: "", points: 100 });

  // keep a valid category selected in the form
  useEffect(() => {
    if (categories.length && !categories.some((c) => c.id === qForm.categoryId)) {
      setQForm((f) => ({ ...f, categoryId: categories[0].id }));
    }
    if (!categories.length && qForm.categoryId) setQForm((f) => ({ ...f, categoryId: "" }));
  }, [categories]); // eslint-disable-line

  const addQuestion = () => {
    if (!qForm.text.trim() || !qForm.categoryId) return;
    setQuestions((q) => [...q, { id: uid(), text: qForm.text.trim(), categoryId: qForm.categoryId, points: Number(qForm.points) || 100 }]);
    setQForm((f) => ({ ...f, text: "" }));
  };
  const removeQuestion = (id) => setQuestions((q) => q.filter((x) => x.id !== id));

  const loadSets = (setNames) => {
    // gather all questions from selected sets
    const allQs = QUESTION_SETS
      .filter((s) => setNames.includes(s.name))
      .flatMap((s) => s.questions);
    if (!allQs.length) return;
    // build categories, merging with existing ones
    const newCatNames = [...new Set(allQs.map((q) => q.cat))];
    setCategories((prevCats) => {
      const merged = [...prevCats];
      newCatNames.forEach((name) => {
        if (!merged.some((c) => c.name === name)) {
          merged.push({ id: uid(), name, color: CATEGORY_COLORS[merged.length % CATEGORY_COLORS.length] });
        }
      });
      return merged;
    });
    // add questions, avoiding exact duplicates (same text+points+cat)
    setCategories((prevCats) => {
      const catMap = Object.fromEntries(prevCats.map((c) => [c.name, c.id]));
      setQuestions((prevQs) => {
        const existing = new Set(prevQs.map((q) => {
          const cat = prevCats.find((c) => c.id === q.categoryId);
          return (cat?.name || "") + "|" + q.text + "|" + q.points;
        }));
        const toAdd = allQs
          .filter((q) => !existing.has(q.cat + "|" + q.text + "|" + q.points))
          .map((q) => ({ id: uid(), text: q.text, points: q.points, categoryId: catMap[q.cat] }));
        return [...prevQs, ...toAdd];
      });
      return prevCats; // no change to cats here, already set above
    });
  };

  /* ---------- game flow ---------- */
  const [activeQId, setActiveQId] = useState(null);
  const [turnIdx, setTurnIdx] = useState(0);

  const openCategorySelect = () => {
    if (teams.length < 2 || eligibleCats.length < 3) return;
    setSelectedCatIds((prev) => {
      const valid = prev.filter((id) => eligibleCats.some((c) => c.id === id));
      if (valid.length >= 3) return valid.slice(0, 6);
      return eligibleCats.slice(0, 6).map((c) => c.id);
    });
    setPhase("selectCats");
  };

  const toggleCat = (id) => {
    setSelectedCatIds((prev) => {
      if (prev.includes(id)) return prev.filter((x) => x !== id);
      if (prev.length >= 6) return prev;
      return [...prev, id];
    });
  };

  const startGame = () => {
    if (selectedCatIds.length < 3 || selectedCatIds.length > 6) return;
    setAwards({}); setActiveQId(null); setTurnIdx(0);
    // distribute cards: 1 per category max, 4 total across selected cats
    // ── Pick one random question per category+points FIRST ─────────────────
    const picked = [];
    selectedCatIds.forEach((cid) => {
      POINT_VALUES.forEach((pts) => {
        const candidates = questions.filter((q) => q.categoryId === cid && q.points === pts);
        if (candidates.length === 0) return;
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        picked.push(chosen.id);
      });
    });
    setPickedQIds(picked);

    // ── Distribute cards on the FIXED question set ────────────────────────
    if (cardsEnabled) {
      const newMap = {};
      const usedQIds = new Set();
      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

      // helper: pick a random available question from a category in the fixed set
      const pickQ = (cid, extraFilter) => {
        const qs = picked
          .map((id) => questions.find((q) => q.id === id))
          .filter((q) => q && q.categoryId === cid && !usedQIds.has(q.id) &&
            (extraFilter ? extraFilter(q) : true));
        if (!qs.length) return null;
        return qs[Math.floor(Math.random() * qs.length)];
      };

      // ── 3 Big Bang in 3 distinct random categories ────────────────────────
      const bigBangCard = CARDS.find((c) => c.effect === "big_bang");
      const shuffledCatsForBB = shuffle(selectedCatIds).slice(0, Math.min(3, selectedCatIds.length));
      shuffledCatsForBB.forEach((cid) => {
        const q = pickQ(cid);
        if (q) { newMap[q.id] = bigBangCard; usedQIds.add(q.id); }
      });

      // ── 4 random other cards (forced_tie handled dynamically at open time) ──
      const randomPool = shuffle(CARDS.filter((c) => c.effect !== "big_bang" && c.effect !== "forced_tie"));
      const selectedFour = randomPool.slice(0, 4);
      const shuffledCatsForOther = shuffle(selectedCatIds);
      const usedCatsForOther = new Set();
      const remaining = [...selectedFour];

      // first pass: one per category
      remaining.forEach((card, i) => {
        const cat = shuffledCatsForOther.find((cid) => !usedCatsForOther.has(cid));
        if (!cat) return;
        const q = pickQ(cat, card.effect === "all_or_nothing" ? (q) => q.points >= 300 : null);
        if (q) {
          newMap[q.id] = card;
          usedQIds.add(q.id);
          usedCatsForOther.add(cat);
          remaining[i] = null;
        }
      });

      // second pass: leftover cards, any category
      remaining.filter(Boolean).forEach((card) => {
        for (const cid of shuffle(selectedCatIds)) {
          const q = pickQ(cid, card.effect === "all_or_nothing" ? (q) => q.points >= 300 : null);
          if (q) { newMap[q.id] = card; usedQIds.add(q.id); break; }
        }
      });

      setCardMap(newMap);
    } else {
      setCardMap({});
    }

    setPhase("playing");
    sound("start");
  };

  // roundAnswers: { teamId: "correct"|"wrong"|"pass" } for the active question
  const [roundAnswers, setRoundAnswers] = useState({});
  const [doublePoints, setDoublePoints] = useState(false);
  const [directedTarget, setDirectedTarget] = useState(null); // teamId chosen for directed_bounce

  const [cardRevealed, setCardRevealed] = useState(false);
  const [wildcardUsed, setWildcardUsed] = useState(new Set()); // qIds where wildcard was used

  const openQuestion = (qId) => {
    if (awards[qId]?.resolved) return;

    // Dynamically assign forced_tie if in the 25%-50% window and not yet placed
    setCardMap((prevMap) => {
      const alreadyHasForcedTie = Object.values(prevMap).some((c) => c?.effect === "forced_tie");
      if (alreadyHasForcedTie) return prevMap;
      const total = gameQuestions.length;
      const answered = gameQuestions.filter((q) => awards[q.id]?.resolved).length;
      const pct = total > 0 ? answered / total : 0;
      if (pct >= 0.25 && pct < 0.50 && !prevMap[qId]) {
        const forcedTieCard = CARDS.find((c) => c.effect === "forced_tie");
        return { ...prevMap, [qId]: forcedTieCard };
      }
      return prevMap;
    });

    setActiveQId(qId);
    setRoundAnswers({});
    setDoublePoints(false);
    setCardRevealed(false);
    setDirectedTarget(null);
    setTimeLeft(timerDuration);
    setTimerRunning(true);
  };

  // apply card effect (donate_200, swap_scores) immediately on reveal
  // We use the functional form of setAwards to compute current scores from
  // the latest awards state, avoiding stale-closure issues.
  const applyCardEffect = (card) => {
    if (card.effect === "donate_200" || card.effect === "swap_scores" || card.effect === "forced_tie") {
      setAwards((prevAwards) => {
        // recompute scores from prevAwards
        const s = {};
        teams.forEach((t) => (s[t.id] = 0));
        gameQuestions.forEach((q) => {
          const entry = prevAwards[q.id];
          if (entry?.resolved && entry.deltas)
            teams.forEach((t) => { s[t.id] += entry.deltas[t.id] || 0; });
        });
        Object.values(prevAwards).forEach((entry) => {
          if (entry?.isCardEffect && entry.deltas)
            teams.forEach((t) => { s[t.id] += entry.deltas[t.id] || 0; });
        });

        const deltas = {};
        if (card.effect === "donate_200") {
          const sorted = [...teams].sort((a, b) => s[a.id] - s[b.id]);
          const loser = sorted[0];
          teams.forEach((t) => { deltas[t.id] = t.id === loser.id ? (teams.length - 1) * 200 : -200; });
        } else if (card.effect === "swap_scores") {
          const sorted = [...teams].sort((a, b) => s[b.id] - s[a.id]);
          if (sorted.length >= 2) {
            const first = sorted[0], last = sorted[sorted.length - 1];
            teams.forEach((t) => {
              if (t.id === first.id)      deltas[t.id] = s[last.id] - s[first.id];
              else if (t.id === last.id)  deltas[t.id] = s[first.id] - s[last.id];
              else                        deltas[t.id] = 0;
            });
          }
        } else if (card.effect === "forced_tie") {
          const avg = Math.round(teams.reduce((sum, t) => sum + s[t.id], 0) / teams.length);
          teams.forEach((t) => { deltas[t.id] = avg - s[t.id]; });
        }
        return { ...prevAwards, ["card_" + card.effect + "_" + activeQId]: { resolved: true, deltas, isCardEffect: true } };
      });
    }
    setCardRevealed(true);
  };

  // called when a team answers
  const answerTeam = (teamId, result) => {
    const newRound = { ...roundAnswers, [teamId]: result };
    setRoundAnswers(newRound);
    if (result === "correct") sound("correct");

    const activeCard = cardMap[activeQId] || null;
    const noPenalty = activeCard?.effect === "no_penalty";
    const allOrNothing = activeCard?.effect === "all_or_nothing";

    const bigBang = activeCard?.effect === "big_bang";
    // big_bang: everyone must answer (no pass), round only closes when all have responded
    const allResponded = bigBang
      ? teams.every((t) => newRound[t.id] === "correct" || newRound[t.id] === "wrong")
      : teams.every((t) => newRound[t.id] === "correct" || newRound[t.id] === "wrong" || newRound[t.id] === "pass");
    const someoneCorrect = teams.some((t) => newRound[t.id] === "correct");
    const roundOver = bigBang ? allResponded : (someoneCorrect || allResponded || noPenalty);

    if (roundOver) {
      const baseMult = (allOrNothing ? 2 : 1) * (doublePoints ? 2 : 1);

      // big_bang: count correct/wrong to apply lone-double rule
      const correctTeams = teams.filter((t) => newRound[t.id] === "correct");
      const wrongTeams   = teams.filter((t) => newRound[t.id] === "wrong");
      const loneCorrect  = bigBang && correctTeams.length === 1;
      const loneWrong    = bigBang && wrongTeams.length === 1;

      const deltas = {};
      teams.forEach((t) => {
        const ans = newRound[t.id];
        let mult = baseMult;
        if (loneCorrect && ans === "correct") mult = baseMult * 2;
        if (loneWrong   && ans === "wrong")   mult = baseMult * 2;
        if (ans === "correct")     deltas[t.id] = +activeQ.points * mult;
        else if (ans === "wrong")  deltas[t.id] = noPenalty ? 0 : -activeQ.points * mult;
        else                       deltas[t.id] = 0;
      });
      setAwards((a) => ({ ...a, [activeQId]: { resolved: true, deltas } }));
      setTurnIdx((i) => (i + 1) % teams.length);
      setTimerRunning(false);
      setActiveQId(null);
      setRoundAnswers({});
      setDoublePoints(false);
      setCardRevealed(false);
      setDirectedTarget(null);
      resetTimer();
    }
  };

  const closeQuestion = () => {
    setActiveQId(null);
    setRoundAnswers({});
    setDoublePoints(false);
    setDirectedTarget(null);
    setTimerRunning(false);
    resetTimer();
  };

  const playAgain = () => {
    setAwards({}); setActiveQId(null); setRoundAnswers({});
    setDoublePoints(false); setTurnIdx(0); setCardMap({}); setPickedQIds(null); setDirectedTarget(null); setWildcardUsed(new Set());
    setPhase("playing"); sound("start");
  };

  const activeQ = gameQuestions.find((q) => q.id === activeQId) || null;
  const answeredCount = gameQuestions.filter((x) => awards[x.id] && awards[x.id] !== "none" && awards[x.id]?.resolved).length;
  const allDone = answeredCount === gameQuestions.length && gameQuestions.length > 0;

  /* ============================================================ */
  return (
    <div style={S.root}>
      <StyleTag />
      <div style={S.stage}>
        {/* Top bar */}
        {/* Watermark */}
      <div style={{ position: "fixed", bottom: 14, right: 18, fontSize: 11, color: "rgba(255,255,255,0.18)", fontWeight: 600, letterSpacing: 0.5, pointerEvents: "none", zIndex: 9999, userSelect: "none" }}>
        Creado por Jorge Sancho
      </div>

      <header style={S.topbar}>
          <div style={S.brand}>
            <span style={S.brandMark}>◆</span>
            <span style={S.brandText}>THE BIG BANG<span style={{ color: "var(--lime)" }}> CONTEST</span></span>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            {phase !== "setup" && (
              <button style={S.ghostBtn} onClick={() => { setPhase("setup"); resetTimer(); }}>← Configuración</button>
            )}
            <button style={S.iconBtn} onClick={() => setMuted((m) => !m)} title={muted ? "Activar sonido" : "Silenciar"}>
              {muted ? "🔇" : "🔊"}
            </button>
          </div>
        </header>

        {phase === "setup" && (
          <Setup
            teams={teams} addTeam={addTeam} removeTeam={removeTeam} renameTeam={renameTeam}
            categories={categories} catForm={catForm} setCatForm={setCatForm} addCategory={addCategory} removeCategory={removeCategory}
            questions={questions} qForm={qForm} setQForm={setQForm} addQuestion={addQuestion}
            removeQuestion={removeQuestion} loadSets={loadSets}
            timerEnabled={timerEnabled} setTimerEnabled={setTimerEnabled}
            timerDuration={timerDuration} setTimerDuration={(v) => { setTimerDuration(v); setTimeLeft(v); }}
            startGame={openCategorySelect} eligibleCount={eligibleCats.length}
          />
        )}

        {phase === "selectCats" && (
          <SelectCats
            categories={eligibleCats} questions={questions}
            selected={selectedCatIds} toggle={toggleCat}
            cardsEnabled={cardsEnabled} setCardsEnabled={setCardsEnabled}
            onBack={() => setPhase("setup")} onStart={startGame}
          />
        )}

        {phase === "playing" && (
          <Playing
            gameQuestions={gameQuestions} selectedCatIds={selectedCatIds} catById={catById}
            teams={teams} scores={scores} awards={awards} turnIdx={turnIdx}
            activeQ={activeQ} openQuestion={openQuestion} closeQuestion={closeQuestion}
            roundAnswers={roundAnswers} answerTeam={answerTeam}
            doublePoints={doublePoints} setDoublePoints={setDoublePoints}
            cardMap={cardMap} cardRevealed={cardRevealed} applyCardEffect={applyCardEffect}
            directedTarget={directedTarget} setDirectedTarget={setDirectedTarget}
            wildcardUsed={wildcardUsed} setWildcardUsed={setWildcardUsed}
            timerEnabled={timerEnabled} timeLeft={timeLeft} timerDuration={timerDuration}
            timerRunning={timerRunning} setTimerRunning={setTimerRunning} resetTimer={resetTimer}
            answeredCount={answeredCount} allDone={allDone}
            finish={() => setPhase("results")}
          />
        )}

        {phase === "results" && (
          <Results teams={teams} scores={scores} ranking={ranking} playAgain={playAgain} setPhase={setPhase} />
        )}

        {phase === "prize" && (
          <Prize winners={ranking.filter((t) => (scores[t.id] || 0) === Math.max(...teams.map((x) => scores[x.id]), 0) && scores[t.id] > 0)}
            onBack={() => setPhase("results")} />
        )}
      </div>
    </div>
  );
}

/* ===================== SETS DROPDOWN ===================== */
function SetsDropdown({ loadSets }) {
  const [open, setOpen] = React.useState(false);
  const [selected, setSelected] = React.useState([]);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const toggle = (name) => setSelected((prev) =>
    prev.includes(name) ? prev.filter((x) => x !== name) : [...prev, name]
  );

  const handleLoad = () => {
    if (!selected.length) return;
    loadSets(selected);
    setSelected([]);
    setOpen(false);
  };

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button style={S.linkBtn} onClick={() => setOpen((v) => !v)}>
        Cargar set existente {open ? "▲" : "▼"}
      </button>
      {open && (
        <div style={S.setsPanel}>
          <div style={{ fontSize: 11, fontWeight: 800, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
            Sets disponibles
          </div>
          {QUESTION_SETS.map((s) => {
            const on = selected.includes(s.name);
            return (
              <label key={s.name} style={{ ...S.setRow, background: on ? "rgba(25,227,244,0.08)" : "transparent" }}>
                <input type="checkbox" checked={on} onChange={() => toggle(s.name)}
                  style={{ accentColor: "var(--cyan)", width: 15, height: 15, flexShrink: 0 }} />
                <span style={{ flex: 1, fontWeight: 600, fontSize: 13 }}>{s.name}</span>
                <span style={{ color: "var(--muted)", fontSize: 12 }}>
                  {s.questions.length} preguntas · {[...new Set(s.questions.map(q => q.cat))].length} cats
                </span>
              </label>
            );
          })}
          <button
            style={{ ...S.softBtn, marginTop: 10, width: "100%", opacity: selected.length ? 1 : 0.4, justifyContent: "center" }}
            onClick={handleLoad} disabled={!selected.length}>
            Cargar {selected.length > 0 ? `(${selected.length})` : ""}
          </button>
        </div>
      )}
    </div>
  );
}

/* ===================== SETUP ===================== */
function Setup(props) {

    timerEnabled, setTimerEnabled, timerDuration, setTimerDuration, startGame, eligibleCount } = props;
  const ready = teams.length >= 2 && eligibleCount >= 3;
  const [bankOpen, setBankOpen] = useState(false);

  // group questions by category for the bank view
  const groups = categories.map((c) => ({ ...c, items: questions.filter((q) => q.categoryId === c.id) }));
  const uncategorized = questions.filter((q) => !categories.some((c) => c.id === q.categoryId));

  return (
    <div style={S.setupGrid} className="fade-in">
      {/* TEAMS */}
      <section style={S.card}>
        <h2 style={S.h2}>Equipos <span style={S.count}>{teams.length}</span></h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {teams.map((t) => (
            <div key={t.id} style={S.teamRow}>
              <span style={{ ...S.colorDot, background: t.color }} />
              <input style={S.teamInput} value={t.name} maxLength={22}
                onChange={(e) => renameTeam(t.id, e.target.value)} />
              {teams.length > 2 && (
                <button style={S.removeBtn} onClick={() => removeTeam(t.id)}>✕</button>
              )}
            </div>
          ))}
        </div>
        <button style={{ ...S.softBtn, marginTop: 12, opacity: teams.length >= 8 ? 0.4 : 1 }}
          onClick={addTeam} disabled={teams.length >= 8}>+ Añadir equipo</button>

        <div style={{ ...S.divider }} />

        <h3 style={S.h3}>Temporizador</h3>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <button style={timerEnabled ? S.toggleOn : S.toggleOff} onClick={() => setTimerEnabled((v) => !v)}>
            <span style={timerEnabled ? S.knobOn : S.knobOff} />
          </button>
          <span style={{ color: "var(--muted)", fontSize: 14 }}>{timerEnabled ? "Activado" : "Desactivado"}</span>
        </div>
        {timerEnabled && (
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            {[15, 30, 45, 60].map((s) => (
              <button key={s} onClick={() => setTimerDuration(s)}
                style={timerDuration === s ? S.chipActive : S.chip}>{s}s</button>
            ))}
          </div>
        )}
      </section>

      {/* QUESTION BANK */}
      <section style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <h2 style={{ ...S.h2, marginBottom: 0 }}>Banco de preguntas <span style={S.count}>{questions.length}</span></h2>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <button style={{ ...S.softBtn, opacity: questions.length ? 1 : 0.45 }} onClick={() => setBankOpen(true)} disabled={!questions.length}>👁 Ver preguntas</button>
            <SetsDropdown loadSets={loadSets} />
          </div>
        </div>

        {/* --- CATEGORY CREATOR --- */}
        <h3 style={{ ...S.h3, marginTop: 6 }}>Categorías <span style={S.miniCount}>{categories.length}</span></h3>
        <div style={{ display: "flex", gap: 8 }}>
          <input style={{ ...S.input, flex: 1 }} placeholder="Nueva categoría (p. ej. Historia)…" value={catForm}
            onChange={(e) => setCatForm(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addCategory()} />
          <button style={S.softBtn} onClick={addCategory}>+ Crear</button>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
          {categories.length === 0 && <span style={S.emptySm}>Crea al menos una categoría para empezar a añadir preguntas.</span>}
          {categories.map((c) => (
            <span key={c.id} style={{ ...S.catPill, borderColor: c.color, color: c.color }}>
              <span style={{ ...S.catPillDot, background: c.color }} />
              {c.name}
              <button style={S.catPillX} onClick={() => removeCategory(c.id)} title="Eliminar categoría">✕</button>
            </span>
          ))}
        </div>

        <div style={S.divider} />

        {/* --- QUESTION CREATOR --- */}
        <h3 style={S.h3}>Crear pregunta</h3>
        <div style={S.qForm}>
          <input style={S.input} placeholder="Escribe la pregunta…" value={qForm.text}
            onChange={(e) => setQForm({ ...qForm, text: e.target.value })}
            onKeyDown={(e) => e.key === "Enter" && addQuestion()} />

          {/* category selector */}
          <div>
            <span style={S.fieldLabel}>Categoría</span>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {categories.length === 0 && <span style={S.emptySm}>↑ Crea una categoría primero</span>}
              {categories.map((c) => {
                const sel = qForm.categoryId === c.id;
                return (
                  <button key={c.id} onClick={() => setQForm({ ...qForm, categoryId: c.id })}
                    style={{ ...S.selChip, borderColor: c.color, background: sel ? c.color : "transparent", color: sel ? "#0B0B1E" : c.color }}>
                    {c.name}
                  </button>
                );
              })}
            </div>
          </div>

          {/* points selector */}
          <div>
            <span style={S.fieldLabel}>Puntos</span>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              {POINT_VALUES.map((p) => (
                <button key={p} style={qForm.points === p ? S.chipActive : S.chip}
                  onClick={() => setQForm({ ...qForm, points: p })}>{p}</button>
              ))}
              <button style={{ ...S.softBtn, marginLeft: "auto", opacity: (!qForm.text.trim() || !qForm.categoryId) ? 0.45 : 1 }}
                onClick={addQuestion} disabled={!qForm.text.trim() || !qForm.categoryId}>+ Añadir pregunta</button>
            </div>
          </div>
        </div>
      </section>

      {/* START */}
      <div style={S.startBar}>
        <button style={ready ? S.startBtn : S.startBtnDisabled} onClick={startGame} disabled={!ready}>
          ELEGIR CATEGORÍAS →
        </button>
        {!ready && <p style={S.hint}>Necesitas 2 equipos y al menos 3 categorías con preguntas.</p>}
      </div>

      {bankOpen && (
        <BankModal groups={groups} uncategorized={uncategorized} total={questions.length}
          onClose={() => setBankOpen(false)} removeQuestion={removeQuestion} />
      )}
    </div>
  );
}

    <div style={S.modalBackdrop} onClick={onClose}>

          <h2 style={{ ...S.h2, marginBottom: 0 }}>Banco de preguntas <span style={S.count}>{total}</span></h2>

        <div style={S.modalBody}>

/* ===================== CATEGORY SELECTION ===================== */

  const ok = n >= 3 && n <= 6;
  const countFor = (id) => questions.filter((q) => q.categoryId === id).length;
  const totalQ = questions.filter((q) => selected.includes(q.categoryId)).length;

  return (
    <div style={S.selWrap} className="fade-in">
      <h2 style={S.selTitle}>Elige las categorías del concurso</h2>
      <p style={S.selSub}>Selecciona entre <b style={{ color: "var(--lime)" }}>3 y 6</b> categorías para comenzar.</p>

      <div style={S.selGrid}>
        {categories.map((c) => {
          const on = selected.includes(c.id);
          const disabled = !on && n >= 6;
          return (
            <button key={c.id} onClick={() => toggle(c.id)} disabled={disabled}
              style={{
                ...S.selCard,
                borderColor: on ? c.color : "var(--border)",
                background: on ? c.color + "22" : "rgba(0,0,0,0.22)",
                opacity: disabled ? 0.4 : 1,
                cursor: disabled ? "not-allowed" : "pointer",

/* ===================== PLAYING ===================== */
function Playing(props) {
  const {
    gameQuestions, selectedCatIds, catById,
    teams, scores, awards, turnIdx,
    activeQ, openQuestion, closeQuestion,
    roundAnswers, answerTeam,
    doublePoints, setDoublePoints,
    cardMap, cardRevealed, applyCardEffect,
    directedTarget, setDirectedTarget,
    wildcardUsed, setWildcardUsed,
    timerEnabled, timeLeft, timerDuration, timerRunning, setTimerRunning, resetTimer,
    answeredCount, allDone, finish,
  } = props;

  const maxScore = Math.max(...teams.map((t) => scores[t.id]), 0);

  // teams still active this round (haven't answered yet)
  const pending = activeQ ? teams.filter((t) => !roundAnswers[t.id]) : [];

  return (
    <div style={S.boardLayout} className="fade-in">

      {/* ── BOARD ── */}
      <div style={S.boardMain}>
        <div style={{ ...S.boardGrid, gridTemplateColumns: `repeat(${selectedCatIds.length}, 1fr)` }}>
          {/* column headers */}
          {selectedCatIds.map((cid) => {
            const cat = catById[cid];
            return (
              <div key={cid} style={{ ...S.colHeader, borderColor: cat ? cat.color : "var(--border)", color: cat ? cat.color : "var(--text)" }}>
                {cat ? cat.name : "—"}
              </div>
            );
          })}

          {/* cells per point value */}
          {POINT_VALUES.map((pts) =>
            selectedCatIds.map((cid) => {
              const q = gameQuestions.find((x) => x.categoryId === cid && x.points === pts);
              if (!q) return <div key={cid + pts} style={S.cellEmpty} />;

              const entry = awards[q.id];
              const done = entry?.resolved;
              const winnerTeam = done && entry.deltas
                ? teams.find((t) => (entry.deltas[t.id] || 0) > 0)
                : null;
              const isWildcardAvailable = !done && cardMap[q.id]?.effect === "wildcard" && !wildcardUsed.has(q.id);

              return (
                <button key={q.id} onClick={() => openQuestion(q.id)} disabled={!!done}

                    borderColor: done ? (winnerTeam ? winnerTeam.color + "66" : "rgba(255,255,255,0.08)") : "rgba(255,255,255,0.14)",

    <div style={S.resultsWrap} className="fade-in">

      <h1 style={S.winnerName}>

            <span style={{ ...S.scoreDot, background: t.color }} />

  );
}

/* ===================== PRIZE ===================== */
function Prize({ winners, onBack }) {
  const [step, setStep] = React.useState("drum"); // "drum" | "reveal"
  const audioCtx = React.useRef(null);

  // drum roll sound on mount
  React.useEffect(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.current = ctx;
      const now = ctx.currentTime;
      // rapid snare hits accelerating over 2s
      for (let i = 0; i < 40; i++) {
        const t = now + (i * (2 / (i + 8)));
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < data.length; j++) data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (ctx.sampleRate * 0.015));
        const src = ctx.createBufferSource();
        const g = ctx.createGain();
        src.buffer = buf;
        g.gain.setValueAtTime(0.35, t);
        src.connect(g); g.connect(ctx.destination);
        src.start(t);
      }
      // final cymbal crash at 2s
      const osc = ctx.createOscillator();
      const g2 = ctx.createGain();
      osc.type = "sawtooth"; osc.frequency.value = 400;
      g2.gain.setValueAtTime(0.3, now + 2);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
      osc.connect(g2); g2.connect(ctx.destination);
      osc.start(now + 2); osc.stop(now + 2.8);
    } catch(e) {}

    const timer = setTimeout(() => setStep("reveal"), 2200);
    return () => clearTimeout(timer);
  }, []);

  const winnerName = winners.length > 1 ? winners.map((w) => w.name).join(" & ") : (winners[0]?.name || "—");
  const winnerColor = winners[0]?.color || "var(--gold)";

  return (
    <div style={{ ...S.resultsWrap, minHeight: "60vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 24 }} className="fade-in">
      <p style={{ ...S.winnerKicker, fontSize: 14 }}>PREMIO ESPECIAL</p>
      <h2 style={{ fontFamily: "Anton", fontSize: "clamp(28px,5vw,52px)", margin: 0, color: winnerColor, lineHeight: 1.05, textAlign: "center" }}>
        Enhorabuena{winners.length > 1 ? "" : ","}<br />{winnerName}
      </h2>
      <p style={{ color: "var(--muted)", fontSize: 18, margin: 0, fontWeight: 600 }}>vuestro premio es…</p>

      {step === "drum" ? (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
          <DrumRoll />
        </div>
      ) : (
        <div style={{ animation: "popIn .6s cubic-bezier(.2,.9,.3,1.2) both", textAlign: "center" }} className="pop-in">
          <div style={{ fontSize: 64, marginBottom: 12 }}>🎓</div>
          <div style={{ fontFamily: "Anton", fontSize: "clamp(22px,3.5vw,40px)", color: "var(--gold)", lineHeight: 1.2, maxWidth: 580, margin: "0 auto" }}>
            La pregunta del examen que queráis vale el doble
          </div>
        </div>
      )}

      <button style={{ ...S.ghostBtnLg, marginTop: 16 }} onClick={onBack}>← Volver a resultados</button>
    </div>
  );
}

function DrumRoll() {
  const [dots, setDots] = React.useState(1);
  React.useEffect(() => {
    const t = setInterval(() => setDots((d) => (d % 3) + 1), 180);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
      <div style={{ display: "flex", gap: 10 }}>
        {[0,1,2,3,4].map((i) => (
          <div key={i} style={{
            width: 18, height: 18, borderRadius: "50%",
            background: i < dots * 1.7 ? "var(--gold)" : "rgba(255,255,255,0.1)",
            transition: "background .15s",
            animation: `drumPulse ${0.3 + i * 0.06}s ease-in-out infinite alternate`,
          }} />
        ))}
      </div>
      <div style={{ fontFamily: "Anton", fontSize: 28, color: "var(--muted)", letterSpacing: 4 }}>
        {"🥁".repeat(dots)}
      </div>
    </div>
  );
}

/* ===================== CONFETTI ===================== */
function Confetti() {
  const pieces = useMemo(() => {
    const colors = TEAM_COLORS;
    return Array.from({ length: 90 }).map((_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 2.5,
      dur: 2.8 + Math.random() * 2.5,
      color: colors[i % colors.length],
      size: 6 + Math.random() * 8,
      rot: Math.random() * 360,
    }));
  }, []);
  return (
    <div style={S.confettiLayer}>
      {pieces.map((p) => (
        <span key={p.id} className="confetti-piece"
          style={{
            left: `${p.left}%`, width: p.size, height: p.size * 1.4, background: p.color,
            animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`, transform: `rotate(${p.rot}deg)`,
          }} />
      ))}
    </div>
  );
}

/* ===================== STYLE TAG ===================== */
function StyleTag() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
      :root{
        --bg:#0B0B1E; --bg2:#160a2e;
        --surface:rgba(255,255,255,0.05);
        --border:rgba(255,255,255,0.12);
        --text:#F5F3FF; --muted:#9b96c4;
        --lime:#C6F432; --magenta:#FF2E93; --cyan:#19E3F4; --gold:#FFC93C; --violet:#A855F7;
      }
      *{box-sizing:border-box;}
      ::-webkit-scrollbar{width:8px;height:8px;}
      ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:8px;}
      input{font-family:'Hanken Grotesk',sans-serif;}
      input:focus{outline:none;border-color:var(--cyan)!important;}
      button{font-family:'Hanken Grotesk',sans-serif;cursor:pointer;transition:all .18s ease;}
      button:hover{filter:brightness(1.08);}
      @keyframes bgShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
      @keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
      .fade-in{animation:fadeIn .5s cubic-bezier(.2,.8,.2,1) both;}
      @keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(10px);}60%{transform:scale(1.01);}100%{opacity:1;transform:none;}}
      .pop-in{animation:popIn .45s cubic-bezier(.2,.9,.3,1.2) both;}
      @keyframes revealIn{from{opacity:0;transform:translateY(8px) scale(.96);}to{opacity:1;transform:none;}}
      .reveal{animation:revealIn .35s ease both;}
      @keyframes confettiFall{0%{transform:translateY(-40px) rotate(0);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
      @keyframes drumPulse{from{transform:scale(1);}to{transform:scale(1.4);}}
      .confetti-piece{position:absolute;top:-20px;border-radius:2px;animation-name:confettiFall;animation-timing-function:linear;animation-iteration-count:1;}
    `}</style>
  );
}
